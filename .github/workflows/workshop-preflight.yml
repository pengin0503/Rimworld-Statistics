name: Prepare Steam Workshop candidate (NO UPLOAD)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/workshop-preflight.yml'
      - 'tools/prepare_workshop.py'
      - 'tools/generate_workshop_preview.py'
      - 'tools/make_workshop_vdf.ps1'
      - 'tools/tests/test_workshop_preflight.py'
      - 'docs/workshop/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/workshop-preflight.yml'
      - 'tools/prepare_workshop.py'
      - 'tools/generate_workshop_preview.py'
      - 'tools/make_workshop_vdf.ps1'
      - 'tools/tests/test_workshop_preflight.py'
      - 'docs/workshop/**'

permissions:
  contents: read

jobs:
  prepare:
    name: Stage immutable v1.3.0 release + preview (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview renderer dependency
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

      - name: Validate Windows VDF tool is testable on the runner
        run: command -v pwsh

      - name: Validate preparation rules offline (including PowerShell)
        run: python -m unittest discover -s tools/tests -p 'test_workshop_preflight.py' -v

      - name: Fetch the exact published GitHub release (no build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/workshop-source"
          gh release download v1.3.0 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/workshop-source" \
            --pattern 'RimworldStatistics-v1.3.0.zip' \
            --pattern 'RimworldStatistics-v1.3.0.sha256'
          (cd "$RUNNER_TEMP/workshop-source" && sha256sum -c RimworldStatistics-v1.3.0.sha256)

      - name: Generate preview and stage exact release
        run: |
          set -euo pipefail
          python tools/generate_workshop_preview.py --out "$RUNNER_TEMP/workshop-preview.png"
          python tools/prepare_workshop.py \
            --zip "$RUNNER_TEMP/workshop-source/RimworldStatistics-v1.3.0.zip" \
            --sha256 "$RUNNER_TEMP/workshop-source/RimworldStatistics-v1.3.0.sha256" \
            --preview "$RUNNER_TEMP/workshop-preview.png" \
            --license LICENSE \
            --out "$RUNNER_TEMP/workshop-stage" \
            --version 1.3.0 \
            --published-file-id 0

      - name: Verify staged content and artifact
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/workshop-stage/RimworldStatistics/About/Preview.png"
          test -f "$RUNNER_TEMP/workshop-stage/RimworldStatistics/About/About.xml"
          test -f "$RUNNER_TEMP/workshop-stage/RimworldStatistics/LICENSE"
          test ! -e "$RUNNER_TEMP/workshop-stage/RimworldStatistics/Source"
          test ! -e "$RUNNER_TEMP/workshop-stage/RimworldStatistics/VerifyHarness"
          ! find "$RUNNER_TEMP/workshop-stage/RimworldStatistics" -type f \
            \( -iname '*.rws' -o -iname '*.pdb' -o -iname '*secret*' \) | grep -q .
          mkdir -p "$RUNNER_TEMP/workshop-output"
          (
            cd "$RUNNER_TEMP/workshop-stage"
            zip -q -r "$RUNNER_TEMP/workshop-output/RimworldStatistics-Workshop-Candidate-v1.3.0.zip" RimworldStatistics
          )
          (cd "$RUNNER_TEMP/workshop-output" && sha256sum RimworldStatistics-Workshop-Candidate-v1.3.0.zip > RimworldStatistics-Workshop-Candidate-v1.3.0.sha256)
          unzip -t "$RUNNER_TEMP/workshop-output/RimworldStatistics-Workshop-Candidate-v1.3.0.zip"
          cp docs/workshop/pc-publishing.md "$RUNNER_TEMP/workshop-output/PC-PUBLISH.md"
          cp docs/workshop/listing-ja.bbcode docs/workshop/listing-en.bbcode "$RUNNER_TEMP/workshop-output/"
          cp tools/make_workshop_vdf.ps1 "$RUNNER_TEMP/workshop-output/"
          test ! -e "$RUNNER_TEMP/workshop-output/workshop.vdf" # Linux paths are not valid on Windows
          echo 'WORKSHOP_PREP_VERIFIED; STEAM_UPLOAD_NOT_EXECUTED'

      - uses: actions/upload-artifact@v4
        with:
          name: RimworldStatistics-Workshop-Preflight-v1.3.0
          retention-days: 30
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/workshop-output/RimworldStatistics-Workshop-Candidate-v1.3.0.zip
            ${{ runner.temp }}/workshop-output/RimworldStatistics-Workshop-Candidate-v1.3.0.sha256
            ${{ runner.temp }}/workshop-output/PC-PUBLISH.md
            ${{ runner.temp }}/workshop-output/listing-ja.bbcode
            ${{ runner.temp }}/workshop-output/listing-en.bbcode
            ${{ runner.temp }}/workshop-output/make_workshop_vdf.ps1

  windows-vdf-offline:
    name: Windows SteamCMD VDF generation (no upload)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify PowerShell 7 is available
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run offline Workshop preparation and Windows VDF tests
        shell: pwsh
        run: python -m unittest discover -s tools/tests -p 'test_workshop_preflight.py' -v
