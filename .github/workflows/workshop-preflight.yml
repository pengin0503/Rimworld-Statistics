name: Prepare Steam Workshop candidate (NO UPLOAD)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release tag (e.g. v1.4.0); blank uses latest stable"
        required: false
        type: string
  release:
    types: [published]
  pull_request:
    paths:
      - '.github/workflows/workshop-preflight.yml'
      - 'tools/prepare_workshop.py'
      - 'tools/render_workshop_listings.py'
      - 'tools/generate_workshop_preview.py'
      - 'tools/make_workshop_vdf.ps1'
      - 'tools/tests/test_workshop_preflight.py'
      - 'docs/workshop/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/workshop-preflight.yml'
      - 'tools/prepare_workshop.py'
      - 'tools/render_workshop_listings.py'
      - 'tools/generate_workshop_preview.py'
      - 'tools/make_workshop_vdf.ps1'
      - 'tools/tests/test_workshop_preflight.py'
      - 'docs/workshop/**'

permissions:
  contents: read

jobs:
  prepare:
    name: Stage selected stable GitHub release and preview (NO UPLOAD)
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install preview renderer dependency
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - name: Validate preparation rules offline (including PowerShell)
        run: |
          command -v pwsh
          python -m unittest discover -s tools/tests -p 'test_workshop_preflight.py' -v

      - name: Select a published stable GitHub release (no build)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
          EVENT_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${REQUESTED_TAG:-}}"
          if [[ -z "$tag" ]]; then
            tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          fi
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Only published stable vX.Y.Z release tags are supported"
            exit 1
          fi
          version="${tag#v}"
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          jq -e --arg tag "$tag" \
            '.tag_name == $tag and .draft == false and .prerelease == false' <<<"$release" >/dev/null
          zip="RimworldStatistics-${tag}.zip"
          sha="RimworldStatistics-${tag}.sha256"
          jq -e --arg zip "$zip" --arg sha "$sha" \
            '([.assets[].name] | index($zip)) != null and ([.assets[].name] | index($sha)) != null' <<<"$release" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/workshop-source"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/workshop-source" --pattern "$zip" --pattern "$sha"
          test -f "$RUNNER_TEMP/workshop-source/$zip"
          test -f "$RUNNER_TEMP/workshop-source/$sha"
          (cd "$RUNNER_TEMP/workshop-source" && sha256sum -c "$sha")
          echo "Verified published stable release $tag without rebuilding the MOD."

      - name: Generate preview, stage release and render listings
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate_workshop_preview.py --out "$RUNNER_TEMP/workshop-preview.png"
          python tools/prepare_workshop.py \
            --zip "$RUNNER_TEMP/workshop-source/RimworldStatistics-${RELEASE_TAG}.zip" \
            --sha256 "$RUNNER_TEMP/workshop-source/RimworldStatistics-${RELEASE_TAG}.sha256" \
            --preview "$RUNNER_TEMP/workshop-preview.png" \
            --license LICENSE \
            --out "$RUNNER_TEMP/workshop-stage" \
            --version "$MOD_VERSION" \
            --published-file-id 0
          mkdir -p "$RUNNER_TEMP/workshop-output"
          python tools/render_workshop_listings.py --version "$MOD_VERSION" \
            --out "$RUNNER_TEMP/workshop-output"

      - name: Verify candidate, checksum, metadata and handoff files
        shell: bash
        run: |
          set -euo pipefail
          mod="$RUNNER_TEMP/workshop-stage/RimworldStatistics"
          test -f "$mod/About/Preview.png"
          test -f "$mod/About/About.xml"
          test -f "$mod/LICENSE"
          test ! -e "$mod/Source"
          test ! -e "$mod/VerifyHarness"
          test ! -e "$mod/About/PublishedFileId.txt"
          ! find "$mod" -type f \
            \( -iname '*.rws' -o -iname '*.pdb' -o -iname '*secret*' \) | grep -q .
          out="$RUNNER_TEMP/workshop-output"
          (cd "$RUNNER_TEMP/workshop-stage" && \
            zip -q -r "$out/RimworldStatistics-Workshop-Candidate-${RELEASE_TAG}.zip" RimworldStatistics)
          (cd "$out" && \
            sha256sum "RimworldStatistics-Workshop-Candidate-${RELEASE_TAG}.zip" \
            > "RimworldStatistics-Workshop-Candidate-${RELEASE_TAG}.sha256")
          unzip -t "$out/RimworldStatistics-Workshop-Candidate-${RELEASE_TAG}.zip"
          cp "$RUNNER_TEMP/workshop-stage/workshop-manifest.json" "$out/workshop-manifest.json"
          cp docs/workshop/pc-publishing.md "$out/PC-PUBLISH.md"
          cp tools/make_workshop_vdf.ps1 "$out/make_workshop_vdf.ps1"
          printf '%s\n' "$RELEASE_TAG" > "$out/selected-release-tag.txt"
          test ! -e "$out/workshop.vdf" # Linux paths are not portable
          test ! -e "$mod/workshop-manifest.json" # manifest stays outside upload
          echo 'WORKSHOP_PREP_VERIFIED; STEAM_UPLOAD_NOT_EXECUTED'

      - uses: actions/upload-artifact@v4
        with:
          name: RimworldStatistics-Workshop-Preflight-${{ steps.release.outputs.tag }}
          retention-days: 30
          if-no-files-found: error
          path: ${{ runner.temp }}/workshop-output/

  windows-vdf-offline:
    name: Windows SteamCMD VDF generation (NO UPLOAD)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cross-version Workshop and Windows VDF tests
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          python -m unittest discover -s tools/tests -p 'test_workshop_preflight.py' -v
