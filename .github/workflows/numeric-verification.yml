name: Numeric statistics build, tests and development packages

on:
  push:
    branches:
      - main
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'examples/**'
      - 'docs/sdk/**'
      - 'tools/**'
      - 'Languages/**'
      - 'Defs/**'
      - '.github/workflows/numeric-verification.yml'
      - '.github/workflows/publish.yml'
      - 'docs/releases/**'
      - 'About/**'
      - 'Directory.Build.props'
      - 'global.json'
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'examples/**'
      - 'docs/sdk/**'
      - 'tools/**'
      - 'Languages/**'
      - 'Defs/**'
      - '.github/workflows/numeric-verification.yml'
      - '.github/workflows/publish.yml'
      - 'docs/releases/**'
      - 'About/**'
      - 'Directory.Build.props'
      - 'global.json'
  workflow_dispatch:
  # Full performance measurements remain available manually and run weekly.
  schedule:
    - cron: '0 18 * * 0' # Monday 03:00 JST

permissions:
  contents: read

# Cancel superseded runs on the same PR, while never cancelling push runs on main (required by publish.yml).
concurrency:
  group: numeric-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache pinned optional MOD audit inputs
        uses: actions/cache@v4
        with:
          path: .devinputs/integrated
          key: integrated-mods-${{ hashFiles('tools/IntegratedModAudit/fetch_pinned_mods.sh') }}

      - name: Cache immutable reference metadata indexes
        uses: actions/cache@v4
        with:
          path: .devinputs/ref-indexes
          key: ref-indexes-${{ runner.os }}-${{ hashFiles('tools/RefMetadataIndex/**', 'Source/RimworldStatistics/RimworldStatistics.csproj', 'tools/IntegratedModAudit/fetch_pinned_mods.sh') }}

      # Read-only pinned public sources. No target assembly is bundled; cached files are SHA-256 verified.
      - name: Fetch or verify pinned optional MOD audit inputs (read-only)
        run: bash tools/IntegratedModAudit/fetch_pinned_mods.sh

      - name: Restore and build all CI assemblies in parallel
        run: dotnet build tools/ci.slnx -c Release -m -p:UseNuGetRefs=true

      - name: Audit optional MOD contracts and pinned public IL (read-only)
        shell: bash
        run: |
          set -euo pipefail
          s=.devinputs/integrated/saurid
          p=.devinputs/integrated/phytokin
          python3 tools/IntegratedModAudit/check_race_birth_contract.py "$s" "$p"
          sha256sum "$s/1.6/Assemblies/VRESaurids.dll" "$p/1.6/Assemblies/VanillaRacesExpanded-Phytokin.dll"
          dotnet tools/IntegratedModAudit/RaceBirthIlAudit/bin/Release/net10.0/RaceBirthIlAudit.dll \
            "$s/1.6/Assemblies/VRESaurids.dll" "$p/1.6/Assemblies/VanillaRacesExpanded-Phytokin.dll"
          # Wrong target versions must fail closed, not silently pass an unrelated DLL.
          if dotnet tools/IntegratedModAudit/RaceBirthIlAudit/bin/Release/net10.0/RaceBirthIlAudit.dll \
            "$p/1.6/Assemblies/VanillaRacesExpanded-Phytokin.dll" "$s/1.6/Assemblies/VRESaurids.dll"; then
            echo "Race birth IL audit accepted swapped/incorrect target assemblies" >&2
            exit 1
          fi

          python3 tools/IntegratedModAudit/check_outposts_contract.py .devinputs/integrated/vef-outposts .devinputs/integrated/voe
          python3 tools/IntegratedModAudit/check_vpe_contract.py .devinputs/integrated/vpe .devinputs/integrated/vef-outposts
          vpe=.devinputs/integrated/vpe/1.7/Assemblies/VanillaPsycastsExpanded.dll
          vef=.devinputs/integrated/vef-outposts/1.7/Assemblies/VEF.dll
          test "$(stat -c%s "$vpe")" -eq 338944
          test "$(stat -c%s "$vef")" -eq 1567744
          printf '646245929f2a2d3121de8298abb602fa  %s\n' "$vpe" | md5sum -c -
          printf 'c22466f560cec75f6f0092ab52067da4  %s\n' "$vef" | md5sum -c -
          dotnet tools/IntegratedModAudit/VpeCastIlAudit/bin/Release/net10.0/VpeCastIlAudit.dll "$vpe" "$vef"

          python3 tools/IntegratedModAudit/check_vte_contract.py .devinputs/integrated/vte
          # Exact binary identity check for the v1.6 DLL selected by loadFolders for RimWorld 1.7.
          vte=.devinputs/integrated/vte/1.6/Assemblies/VanillaTradingExpanded.dll
          test "$(stat -c%s "$vte")" -eq 153088
          printf 'b76e66b58f02b28f40bb7446970bcb1e  %s\n' "$vte" | md5sum -c -
          dotnet tools/IntegratedModAudit/VteIlAudit/bin/Release/net10.0/VteIlAudit.dll "$vte"

          python3 tools/IntegratedModAudit/check_sau_contract.py .devinputs/integrated/sau
          python3 tools/IntegratedModAudit/check_recruitment_contract.py .devinputs/integrated/recruitment
          python3 tools/IntegratedModAudit/check_hospitality_contract.py .devinputs/integrated/hospitality
          python3 tools/IntegratedModAudit/check_dbh_contract.py .devinputs/integrated/dbh
          dotnet tools/IntegratedModAudit/BadHygieneIlAudit/bin/Release/net10.0/BadHygieneIlAudit.dll \
            .devinputs/integrated/dbh/1.7/Assemblies/BadHygiene.dll \
            .devinputs/integrated/dbh-3258/1.7/Assemblies/BadHygiene.dll

          krafs_ver=$(grep -oE 'Krafs\.Rimworld\.Ref"\s+Version="[^"]+"' Source/RimworldStatistics/RimworldStatistics.csproj | sed -E 's/.*Version="([^"]+)"/\1/' | head -n 1)
          krafs_ver="${krafs_ver:-1.7.4985-unstable}"
          game_ref=$(find "$HOME/.nuget/packages/krafs.rimworld.ref/$krafs_ver" -type f -name 'Assembly-CSharp.dll' | head -n 1)
          test -f "$game_ref"
          dotnet tools/IntegratedModAudit/AdapterSignatureAudit/bin/Release/net10.0/AdapterSignatureAudit.dll \
            .devinputs/integrated --game-dll "$game_ref"
          if dotnet tools/IntegratedModAudit/AdapterSignatureAudit/bin/Release/net10.0/AdapterSignatureAudit.dll \
            .devinputs/integrated --override giddyup=.devinputs/integrated/vse/1.7/Assemblies/VSE.dll; then
            echo "Adapter signature audit accepted swapped/incorrect target assembly" >&2
            exit 1
          fi

      - name: Static packaging/hook guards and Python tool unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/IntegratedModAudit/check_embedded_integrations.py
          python3 tools/check_player_faction_access.py
          python3 -m py_compile tools/check_private_save_shapes.py
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tools/PrivateSaveProbe -p 'test_private_research_probe.py' -v

      - name: Core unit tests (no game launch)
        run: dotnet test --project Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --no-build

      # The complete benchmark suite is intentionally opt-in / weekly: on PRs and regular pushes
      # preserve fast compile, all xUnit cases, API audits, key checks and package verification.
      - name: External SDK event allocation and throughput benchmark
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: dotnet run -c Release --project tools/SdkEventBenchmark/SdkEventBenchmark.csproj --no-launch-profile
      - name: Profile scaling benchmark (100–3000 synthetic saves)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project tools/ProfileBenchmark/ProfileBenchmark.csproj --no-launch-profile \
            > "$RUNNER_TEMP/rws-profile-benchmark.csv"
          cat "$RUNNER_TEMP/rws-profile-benchmark.csv"
      - name: Profile 5 and 10 MiB import-only write benchmark
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: dotnet run -c Release --project tools/ProfileBenchmark/ProfileBenchmark.csproj --no-launch-profile -- --large
      - name: Representative 0.2/5/10 MiB profile write and game-thread wait benchmark
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: dotnet run -c Release --project tools/ProfileBenchmark/ProfileBenchmark.csproj --no-launch-profile -- --representative
      - name: Synthetic historical .rws cold/warm scan (55 saves)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project tools/SaveImportBenchmark/SaveImportBenchmark.csproj --no-launch-profile -- 55 262144
      - name: Synthetic 35-colony by-item leaderboard benchmark
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: dotnet run -c Release --project tools/CrossColonyBenchmark/CrossColonyBenchmark.csproj --no-launch-profile
      - name: Matched synthetic breakdown lookup A/B benchmark
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: dotnet run -c Release --project tools/BreakdownLookupBenchmark/BreakdownLookupBenchmark.csproj --no-launch-profile

      - name: Translation key consistency
        run: bash tools/check_keys.sh

      - name: Package and validate production and harness ZIPs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/package.sh --no-build "$RUNNER_TEMP/RimworldStatistics-unverified.zip"
          bash tools/VerifyHarness/package.sh --no-build "$RUNNER_TEMP/RimworldStatisticsVerifyHarness.zip"
          cp tools/VerifyHarness/launch-windows.ps1 "$RUNNER_TEMP/RWS-Verify-Windows.ps1"
          python3 tools/check_sdk_package.py "$RUNNER_TEMP/RimworldStatistics-unverified.zip" \
            --verify-contents \
            --harness-zip "$RUNNER_TEMP/RimworldStatisticsVerifyHarness.zip"

      - name: Static Harmony patch targets and self-test (reference metadata)
        shell: bash
        run: |
          set -euo pipefail
          idx=.devinputs/ref-indexes
          if [[ ! -s "$idx/ref-index/chunk-0000.json.gz" \
             || ! -s "$idx/vpe-index/chunk-0000.json.gz" \
             || ! -s "$idx/outposts-index/chunk-0000.json.gz" \
             || ! -s "$idx/vef-index/chunk-0000.json.gz" \
             || ! -s "$idx/voe-index/chunk-0000.json.gz" ]]; then
            krafs_ver=$(grep -oE 'Krafs\.Rimworld\.Ref"\s+Version="[^"]+"' Source/RimworldStatistics/RimworldStatistics.csproj | sed -E 's/.*Version="([^"]+)"/\1/' | head -n 1)
            krafs_ver="${krafs_ver:-1.7.4985-unstable}"
            game_ref=$(find "$HOME/.nuget/packages/krafs.rimworld.ref/$krafs_ver" -type f -name 'Assembly-CSharp.dll' | head -n 1)
            test -f "$game_ref"
            dotnet tools/RefMetadataIndex/bin/Release/net10.0/RefMetadataIndex.dll \
              "$game_ref" "$idx/ref-index" \
              .devinputs/integrated/vpe/1.7/Assemblies/VanillaPsycastsExpanded.dll "$idx/vpe-index" \
              .devinputs/integrated/vef-outposts/1.7/Assemblies/Outposts.dll "$idx/outposts-index" \
              .devinputs/integrated/vef-outposts/1.7/Assemblies/VEF.dll "$idx/vef-index" \
              .devinputs/integrated/voe/1.6/Assemblies/VOE.dll "$idx/voe-index"
          fi
          dotnet tools/PatchTargetCheck/bin/Release/net10.0/PatchTargetCheck.dll 1.7/Assemblies/RimworldStatistics.dll "$idx/ref-index" \
            --field RimWorld.ShipCountdown:shipRoot \
            --field RimWorld.ShipCountdown:customLaunchString \
            --index "$idx/vpe-index" --index "$idx/vef-index" --target 'VpeMetricPatch:VanillaPsycastsExpanded.Hediff_PsycastAbilities:ChangeLevel:int32' \
            --target 'VpeCastMetricPatch:VanillaPsycastsExpanded.AbilityExtension_Psycast:Cast:[Assembly-CSharp]RimWorld.Planet.GlobalTargetInfo[]|[VEF]VEF.Abilities.Ability' \
            --index "$idx/outposts-index" --index "$idx/voe-index" \
            --target 'OutpostProduceMetricPatch:Outposts.Outpost:Produce:' \
            --target 'OutpostProduceMetricPatch:VOE.Outpost_Town:Produce:' \
            --target 'OutpostDeliverMetricPatch:Outposts.Outpost:Deliver:[mscorlib]System.Collections.Generic.IEnumerable`1<[Assembly-CSharp]Verse.Thing>'
          bash tools/PatchTargetCheckSelfTest/run.sh --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: RimworldStatistics-unverified-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RimworldStatistics-unverified.zip
            ${{ runner.temp }}/RimworldStatisticsVerifyHarness.zip
            ${{ runner.temp }}/RWS-Verify-Windows.ps1
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        with:
          name: rws-profile-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/rws-profile-benchmark.csv
          if-no-files-found: error
          retention-days: 14

  windows-verify-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/VerifyHarness/launch-windows.ps1
          sparse-checkout-cone-mode: false
      - name: Guard isolated test profile and idempotent mod-list setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rws-launcher-check'
          $normal = Join-Path $root 'normal'
          $test = Join-Path $root 'test'
          $other = Join-Path $root 'occupied'
          New-Item -ItemType Directory -Path (Join-Path $normal 'Config') -Force | Out-Null
          New-Item -ItemType Directory -Path $other -Force | Out-Null
          $exe = Join-Path $root 'RimWorldWin64.exe'
          Set-Content -LiteralPath $exe -Value 'fake-executable'
          $src = Join-Path $normal 'Config/ModsConfig.xml'
          Set-Content -LiteralPath $src -Value '<ModsConfigData><activeMods><li>ludeon.rimworld</li><li>brrainz.harmony</li><li>extra.test.mod</li></activeMods></ModsConfigData>'
          $hash = (Get-FileHash $src -Algorithm SHA256).Hash
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SetupOnly
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SetupOnly
          if ((Get-FileHash $src -Algorithm SHA256).Hash -ne $hash) { throw 'Normal mod configuration was modified' }
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          $ids = @($xml.SelectNodes('/ModsConfigData/activeMods/li') | ForEach-Object { $_.InnerText })
          foreach ($id in @('pengin0503.rimworldstatistics','pengin0503.rimworldstatistics.verifyharness')) {
            if (@($ids | Where-Object { $_ -eq $id }).Count -ne 1) { throw "Expected exactly one test mod entry for $id" }
          }
          if ($ids[-1] -ne 'pengin0503.rimworldstatistics.verifyharness') { throw 'VerifyHarness must load after the main mod' }
          $originalSave = Join-Path $root 'test-original.rws'
          Set-Content -LiteralPath $originalSave -Value 'original save must stay unchanged'
          $saveHash = (Get-FileHash $originalSave -Algorithm SHA256).Hash
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $originalSave -SetupOnly
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $originalSave -SetupOnly
          if ((Get-FileHash $originalSave -Algorithm SHA256).Hash -ne $saveHash) { throw 'Original save was changed' }
          $copies = @(Get-ChildItem -LiteralPath (Join-Path $test 'Saves') -Filter 'RWSVerify-*.rws')
          if ($copies.Count -ne 1 -or (Get-FileHash $copies[0].FullName -Algorithm SHA256).Hash -ne $saveHash) {
            throw 'Safe disposable test save copy was missing or duplicated'
          }
          $saveWithMods = Join-Path $root 'saved-with-mods.rws'
          Set-Content -LiteralPath $saveWithMods -Value '<savegame><meta><modIds><li>ludeon.rimworld</li><li>brrainz.harmony</li><li>pengin0503.rimworldstatistics</li><li>saved.only.mod</li><li>SAVED.ONLY.MOD</li></modIds></meta><game /></savegame>'
          $saveModsHash = (Get-FileHash $saveWithMods -Algorithm SHA256).Hash
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $saveWithMods -UseSaveModList -SetupOnly
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $saveWithMods -UseSaveModList -SetupOnly
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          $ids = @($xml.SelectNodes('/ModsConfigData/activeMods/li') | ForEach-Object { $_.InnerText })
          $expected = @('ludeon.rimworld','brrainz.harmony','saved.only.mod','pengin0503.rimworldstatistics','pengin0503.rimworldstatistics.verifyharness')
          if (($ids -join '|') -cne ($expected -join '|')) { throw "Save MOD order/duplicates were not preserved: $($ids -join '|')" }
          if ((Get-FileHash $saveWithMods -Algorithm SHA256).Hash -ne $saveModsHash) { throw 'Source save changed after loading MOD list' }
          if ((Get-FileHash $src -Algorithm SHA256).Hash -ne $hash) { throw 'Real MOD config changed after loading save MOD list' }
          $isolatedConfig = Join-Path $test 'Config/ModsConfig.xml'
          $testHash = (Get-FileHash $isolatedConfig -Algorithm SHA256).Hash
          $blocked = $false
          try { & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $saveWithMods -UseSaveModList -Minimal -SetupOnly } catch { $blocked = $true }
          if (-not $blocked) { throw 'Incompatible Minimal + UseSaveModList was not rejected' }
          if ((Get-FileHash $isolatedConfig -Algorithm SHA256).Hash -ne $testHash) { throw 'Invalid flags mutated test MOD config' }
          $blocked = $false
          try { & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $originalSave -UseSaveModList -SetupOnly } catch { $blocked = $true }
          if (-not $blocked) { throw 'Save without a valid modIds header was not rejected' }
          if ((Get-FileHash $isolatedConfig -Algorithm SHA256).Hash -ne $testHash) { throw 'Invalid save mutated test MOD config' }
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -Minimal -SetupOnly
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          if (@($xml.SelectNodes('/ModsConfigData/activeMods/li') | Where-Object { $_.InnerText -eq 'extra.test.mod' }).Count -ne 0) {
            throw 'Minimal mode kept an unrelated third-party mod'
          }
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SetupOnly
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          if (@($xml.SelectNodes('/ModsConfigData/activeMods/li') | Where-Object { $_.InnerText -eq 'extra.test.mod' }).Count -ne 1) {
            throw 'Switching back to full mode did not restore the original test mod list'
          }
          $blocked = $false
          try { & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $normal -SetupOnly } catch { $blocked = $true }
          if (-not $blocked) { throw 'Real save folder was not rejected' }
          Set-Content -LiteralPath (Join-Path $other 'unrelated.txt') -Value 'keep'
          $blocked = $false
          try { & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $other -SetupOnly } catch { $blocked = $true }
          if (-not $blocked) { throw 'Unmarked occupied directory was not rejected' }
