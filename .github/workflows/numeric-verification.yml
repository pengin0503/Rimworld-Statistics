name: Numeric statistics build, tests and development packages

on:
  push:
    branches:
      - main
      - claude/inspiring-shannon-6wqgka
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'examples/**'
      - 'docs/sdk/**'
      - 'tools/**'
      - 'Languages/**'
      - '.github/workflows/numeric-verification.yml'
      - 'About/**'
      - 'Directory.Build.props'
      - 'global.json'
  pull_request:
    paths:
      - 'Source/**'
      - 'Tests/**'
      - 'examples/**'
      - 'docs/sdk/**'
      - 'tools/**'
      - 'Languages/**'
      - '.github/workflows/numeric-verification.yml'
      - 'About/**'
      - 'Directory.Build.props'
      - 'global.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v4
        with:
          repository: pengin0503/Rimworld-Recruitment
          ref: cff2f296bc152ee61000d132107767977193a243
          path: .devinputs/recruitment-1.1.2
          persist-credentials: false
      - name: Verify audited Recruitment 1.1.2 source contract
        run: python3 tools/check_recruitment_contract.py .devinputs/recruitment-1.1.2
      - name: Build pinned Recruitment 1.1.2 optional dependency
        run: dotnet build .devinputs/recruitment-1.1.2/Source/Recruitment/Recruitment.csproj -c Release --nologo
      - name: Compile read-only local save-structure verification tool
        run: python3 -m py_compile tools/check_private_save_shapes.py
      - name: Unit-test independent XML/deflate private-save verifier
        run: python3 -m unittest discover -s tools/tests -p 'test_private_save_shapes.py' -v
      - name: Core unit tests (no game launch)
        run: dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo -p:UseNuGetRefs=true
      - name: External SDK event allocation and throughput benchmark
        run: dotnet run -c Release --project tools/SdkEventBenchmark/SdkEventBenchmark.csproj --no-launch-profile
      - name: Profile scaling benchmark (100–3000 synthetic saves)
        shell: bash
        run: |
          set -euo pipefail
          dotnet run -c Release --project tools/ProfileBenchmark/ProfileBenchmark.csproj --no-launch-profile \
            > "$RUNNER_TEMP/rws-profile-benchmark.csv"
          cat "$RUNNER_TEMP/rws-profile-benchmark.csv"
      - name: Translation key consistency
        run: bash tools/check_keys.sh
      - name: Build production ZIP
        run: bash tools/package.sh "$RUNNER_TEMP/RimworldStatistics-unverified.zip"
      - name: Build independent SDK consumer ZIP (development only)
        run: bash tools/package_sdk_sample.sh "$RUNNER_TEMP/StatisticsSdkSample.zip"
      - name: Validate SDK DLL ownership and package contents
        run: python3 tools/check_sdk_package.py "$RUNNER_TEMP/RimworldStatistics-unverified.zip" "$RUNNER_TEMP/StatisticsSdkSample.zip"
      - name: Build separate development verification harness
        run: bash tools/VerifyHarness/package.sh "$RUNNER_TEMP/RimworldStatisticsVerifyHarness.zip"
      - name: Stage standalone Windows verification launcher with developer packages
        run: cp tools/VerifyHarness/launch-windows.ps1 "$RUNNER_TEMP/RWS-Verify-Windows.ps1"
      - name: Static Harmony patch targets and argument names (1.7.4985 reference metadata)
        shell: bash
        run: |
          set -euo pipefail
          game_ref=$(find "$HOME/.nuget/packages/krafs.rimworld.ref/1.7.4985-unstable" -type f -name 'Assembly-CSharp.dll' | head -n 1)
          test -f "$game_ref"
          dotnet run -c Release --project tools/RefMetadataIndex/RefMetadataIndex.csproj -- "$game_ref" "$RUNNER_TEMP/ref-index"
          python3 tools/inspect_reference_api.py "$RUNNER_TEMP/ref-index/chunk-0000.json.gz"
          dotnet run -c Release --project tools/PatchTargetCheck/PatchTargetCheck.csproj -- 1.7/Assemblies/RimworldStatistics.dll "$RUNNER_TEMP/ref-index"
      - name: Check ZIP content
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$RUNNER_TEMP/RimworldStatistics-unverified.zip"
          unzip -t "$RUNNER_TEMP/RimworldStatisticsVerifyHarness.zip"
          if unzip -Z -1 "$RUNNER_TEMP/RimworldStatistics-unverified.zip" | grep -E '(^|/)(Recruitment\.dll|Recruitment\.csproj|\.devinputs)(/|$)'; then
            echo 'Optional Recruitment dependency or build input leaked into production ZIP' >&2
            exit 1
          fi
          if unzip -Z -1 "$RUNNER_TEMP/RimworldStatistics-unverified.zip" | grep -F 'VerifyHarness'; then
            echo 'Development harness leaked into production ZIP' >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RimworldStatistics-unverified-${{ github.sha }}
          path: |
            ${{ runner.temp }}/RimworldStatistics-unverified.zip
            ${{ runner.temp }}/RimworldStatisticsVerifyHarness.zip
            ${{ runner.temp }}/RWS-Verify-Windows.ps1
            ${{ runner.temp }}/StatisticsSdkSample.zip
            ${{ runner.temp }}/rws-profile-benchmark.csv
          if-no-files-found: error
          retention-days: 14

  sdk-consumer-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        min_minor: [0, 1]
    env:
      UseNuGetRefs: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Independently compile example against SDK minor requirement
        run: dotnet build examples/StatisticsSdkSample/StatisticsSdkSample.csproj -c Release -p:RequiredApiMinor=${{ matrix.min_minor }} --nologo
      - name: Run host-negotiation and event/snapshot consumer probe
        run: dotnet run --project tools/SdkSampleProbe/SdkSampleProbe.csproj -c Release -p:RequiredApiMinor=${{ matrix.min_minor }} --no-launch-profile
      - name: Test host minor 1.0 refusing consumers that require 1.1
        if: matrix.min_minor == 1
        run: dotnet tools/SdkSampleProbe/bin/Release/net10.0/SdkSampleProbe.dll --host-minor-zero
      - name: Run sample when SDK assembly is missing
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="tools/SdkSampleProbe/bin/Release/net10.0"
          test -f "$probe_dir/RimworldStatistics.Api.dll"
          mv "$probe_dir/RimworldStatistics.Api.dll" "$RUNNER_TEMP/api-${{ matrix.min_minor }}.dll"
          dotnet "$probe_dir/SdkSampleProbe.dll" --no-api

  sdk-binary-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile independent consumer against frozen v1.0 binary contract
        run: dotnet build tools/SdkSampleProbe/SdkSampleProbe.csproj -c Release -p:LegacyApiContract=true -p:RequiredApiMinor=0 --nologo
      - name: Replace old binary with production v1.1, keeping consumer binary unchanged
        shell: bash
        run: |
          set -euo pipefail
          probe_dir=tools/SdkSampleProbe/bin/Release/net10.0
          test -f "$probe_dir/RimworldStatistics.Api.dll"
          old_sha=$(sha256sum "$probe_dir/RimworldStatistics.Api.dll" | cut -d' ' -f1)
          dotnet build Source/RimworldStatistics.Api/RimworldStatistics.Api.csproj -c Release --nologo
          cp Source/RimworldStatistics.Api/bin/Release/net10.0/RimworldStatistics.Api.dll "$probe_dir/RimworldStatistics.Api.dll"
          new_sha=$(sha256sum "$probe_dir/RimworldStatistics.Api.dll" | cut -d' ' -f1)
          test "$old_sha" != "$new_sha"
          dotnet "$probe_dir/SdkSampleProbe.dll"
          echo "Frozen 1.0 consumer binary against new 1.1 host DLL: PASS"

  windows-verify-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard isolated test profile and idempotent mod-list setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'rws-launcher-check'
          $normal = Join-Path $root 'normal'
          $test = Join-Path $root 'test'
          $other = Join-Path $root 'occupied'
          New-Item -ItemType Directory -Path (Join-Path $normal 'Config') -Force | Out-Null
          New-Item -ItemType Directory -Path $other -Force | Out-Null
          $exe = Join-Path $root 'RimWorldWin64.exe'
          Set-Content -LiteralPath $exe -Value 'fake-executable'
          $src = Join-Path $normal 'Config/ModsConfig.xml'
          Set-Content -LiteralPath $src -Value '<ModsConfigData><activeMods><li>ludeon.rimworld</li><li>brrainz.harmony</li><li>extra.test.mod</li></activeMods></ModsConfigData>'
          $hash = (Get-FileHash $src -Algorithm SHA256).Hash
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SetupOnly
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SetupOnly
          if ((Get-FileHash $src -Algorithm SHA256).Hash -ne $hash) { throw 'Normal mod configuration was modified' }
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          $ids = @($xml.SelectNodes('/ModsConfigData/activeMods/li') | ForEach-Object { $_.InnerText })
          foreach ($id in @('pengin0503.rimworldstatistics','pengin0503.rimworldstatistics.verifyharness')) {
            if (@($ids | Where-Object { $_ -eq $id }).Count -ne 1) { throw "Expected exactly one test mod entry for $id" }
          }
          if ($ids[-1] -ne 'pengin0503.rimworldstatistics.verifyharness') { throw 'VerifyHarness must load after the main mod' }
          $originalSave = Join-Path $root 'test-original.rws'
          Set-Content -LiteralPath $originalSave -Value 'original save must stay unchanged'
          $saveHash = (Get-FileHash $originalSave -Algorithm SHA256).Hash
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $originalSave -SetupOnly
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SaveFile $originalSave -SetupOnly
          if ((Get-FileHash $originalSave -Algorithm SHA256).Hash -ne $saveHash) { throw 'Original save was changed' }
          $copies = @(Get-ChildItem -LiteralPath (Join-Path $test 'Saves') -Filter 'RWSVerify-*.rws')
          if ($copies.Count -ne 1 -or (Get-FileHash $copies[0].FullName -Algorithm SHA256).Hash -ne $saveHash) {
            throw 'Safe disposable test save copy was missing or duplicated'
          }
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -Minimal -SetupOnly
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          if (@($xml.SelectNodes('/ModsConfigData/activeMods/li') | Where-Object { $_.InnerText -eq 'extra.test.mod' }).Count -ne 0) {
            throw 'Minimal mode kept an unrelated third-party mod'
          }
          & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $test -SetupOnly
          [xml]$xml = Get-Content -LiteralPath (Join-Path $test 'Config/ModsConfig.xml') -Raw
          if (@($xml.SelectNodes('/ModsConfigData/activeMods/li') | Where-Object { $_.InnerText -eq 'extra.test.mod' }).Count -ne 1) {
            throw 'Switching back to full mode did not restore the original test mod list'
          }
          $blocked = $false
          try { & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $normal -SetupOnly } catch { $blocked = $true }
          if (-not $blocked) { throw 'Real save folder was not rejected' }
          Set-Content -LiteralPath (Join-Path $other 'unrelated.txt') -Value 'keep'
          $blocked = $false
          try { & ./tools/VerifyHarness/launch-windows.ps1 -GameExe $exe -NormalDataFolder $normal -TestDataFolder $other -SetupOnly } catch { $blocked = $true }
          if (-not $blocked) { throw 'Unmarked occupied directory was not rejected' }
