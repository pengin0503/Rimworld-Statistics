name: Prepare or publish Rimworld Statistics

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching About.xml and the release notes (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Create the tag and release after successful verification
        required: true
        type: boolean
        default: false
      replace_existing:
        description: >-
          Replace an existing release instead of creating one. Only the release named in About.xml qualifies. With
          publish, its tag moves to this commit and its ZIP and checksum are replaced; the old ones are kept as an
          artifact. Without publish, only checks that the replacement is possible.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-rws
  cancel-in-progress: false

jobs:
  host-release:
    if: github.repository == 'pengin0503/Rimworld-Statistics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
      RELEASE_TAG: ${{ inputs.release_tag }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate version and reject an existing tag or release (unless replacing it)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable vX.Y.Z tag." >&2
            exit 1
          fi
          if [ "$REPLACE_EXISTING" = "true" ]; then
            # Replacing needs the published release and its tag; the About.xml check below limits it to the release
            # of the version on main.
            if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"); then
              echo "No release $RELEASE_TAG to replace." >&2
              exit 1
            fi
            if [ "$(jq -r '.draft' <<<"$release")" != false ] || [ "$(jq -r '.prerelease' <<<"$release")" != false ]; then
              echo "Only a published stable release can be replaced." >&2
              exit 1
            fi
            if [ "$(jq -r '.immutable // false' <<<"$release")" != false ]; then
              echo "Release $RELEASE_TAG is immutable; its assets cannot be replaced." >&2
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "Tag $RELEASE_TAG is missing; refusing to replace." >&2
              exit 1
            fi
          else
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release already exists; refusing overwrite." >&2
              exit 1
            fi
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null || status=$?
            if [ "$status" -ne 2 ]; then
              echo "Tag already exists or its absence could not be verified." >&2
              exit 1
            fi
          fi
          python3 - "$RELEASE_TAG" <<'PY_RELEASE'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          tag = sys.argv[1]
          root = ET.parse("About/About.xml").getroot()
          if root.findtext("modVersion") != tag[1:]:
              sys.exit("About.xml version differs from the release tag.")
          notes = Path(f"docs/releases/{tag}.md")
          if not notes.is_file() or not notes.read_text(encoding="utf-8").strip():
              sys.exit("Missing release notes for the requested tag.")
          PY_RELEASE

      - name: Require successful numeric verification for the release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A PR check is not equivalent to checking the merged commit.
          # Both preflight and publication must use the exact release target SHA.
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/numeric-verification.yml/runs?head_sha=$GITHUB_SHA&per_page=100")
          if ! jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success")] | length > 0' \
            <<<"$runs" >/dev/null; then
            echo "No successful numeric-verification push run for $GITHUB_SHA; refusing release/preflight." >&2
            exit 1
          fi
      - name: Verify stable integrated MOD metric IDs and one installable MOD
        run: python3 tools/IntegratedModAudit/check_embedded_integrations.py

      - name: Verify game-independent core tests
        run: dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo -p:UseNuGetRefs=true

      - name: Validate translations
        run: bash tools/check_keys.sh

      - name: Package and inspect exact host distribution
        shell: bash
        run: |
          set -euo pipefail
          asset="RimworldStatistics-$RELEASE_TAG"
          zip="$RUNNER_TEMP/$asset.zip"
          bash tools/package.sh "$zip"
          python3 tools/check_sdk_package.py "$zip"
          unzip -t "$zip"
          python3 - "$zip" "$RELEASE_TAG" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          from pathlib import Path
          with zipfile.ZipFile(sys.argv[1]) as z:
              root = ET.fromstring(z.read("RimworldStatistics/About/About.xml"))
              assert root.findtext("modVersion") == sys.argv[2][1:]
              paths = z.namelist()
              path_set = set(paths)
              for about_file in ("About/About.xml", "About/Preview.png", "About/PublishedFileId.txt"):
                  member = f"RimworldStatistics/{about_file}"
                  assert member in path_set, f"Missing About file in release zip: {member}"
                  assert z.read(member) == Path(about_file).read_bytes(), f"About file mismatch in release zip: {member}"
              published_id = z.read("RimworldStatistics/About/PublishedFileId.txt").decode("ascii").strip()
              assert published_id.isdigit(), f"Invalid PublishedFileId.txt content: {published_id!r}"
              expected_keyed = {
                  f"RimworldStatistics/{p.as_posix()}"
                  for p in Path("Languages").glob("*/Keyed/*.xml")
              }
              missing_keyed = sorted(expected_keyed - path_set)
              assert not missing_keyed, f"Missing keyed XMLs in release zip: {missing_keyed}"
              for rel_path in sorted(list(Path("Defs").rglob("*.xml")) + list(Path("Languages").glob("*/DefInjected/**/*.xml"))):
                  member = f"RimworldStatistics/{rel_path.as_posix()}"
                  assert member in path_set, f"Missing Def/DefInjected XML in release zip: {member}"
                  assert z.read(member) == rel_path.read_bytes(), f"Def/DefInjected mismatch in release zip: {member}"
              assert all(p.startswith("RimworldStatistics/") for p in paths)
              assert not any(term in p.lower() for p in paths for term in (
                  "verifyharness", "smartapparel", "recruitment", "hospitality", "addon"
              ))
          PY
          (cd "$RUNNER_TEMP" && sha256sum "$asset.zip" > "$asset.sha256" && sha256sum -c "$asset.sha256")

      - name: Archive the verified distribution
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: RimworldStatistics-${{ inputs.release_tag }}-preflight
          path: |
            ${{ runner.temp }}/RimworldStatistics-${{ inputs.release_tag }}.zip
            ${{ runner.temp }}/RimworldStatistics-${{ inputs.release_tag }}.sha256
          if-no-files-found: error

      - name: Create tag and release
        if: ${{ inputs.publish && !inputs.replace_existing }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="RimworldStatistics-$RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/$asset.zip" \
            "$RUNNER_TEMP/$asset.sha256" \
            --target "$GITHUB_SHA" \
            --title "Rimworld Statistics $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.prerelease' <<<"$release")" = false
          names=$(jq -r '[.assets[].name] | sort | join(",")' <<<"$release")
          test "$names" = "$asset.sha256,$asset.zip"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          echo "$RELEASE_TAG published at $GITHUB_SHA with host ZIP and checksum."

      - name: Download the assets about to be replaced
        id: previous
        if: ${{ inputs.publish && inputs.replace_existing }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/replaced"
          mkdir -p "$previous"
          gh release download "$RELEASE_TAG" --dir "$previous" --pattern "RimworldStatistics-$RELEASE_TAG.*"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          echo "$sha" > "$previous/previous-tag-sha.txt"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          ls -l "$previous"
          echo "Previous $RELEASE_TAG tag: $sha"

      - name: Keep the replaced assets
        if: ${{ inputs.publish && inputs.replace_existing }}
        uses: actions/upload-artifact@v4
        with:
          # Named by the commit the tag pointed to: a re-run after the tag has moved keeps the first copy.
          name: RimworldStatistics-${{ inputs.release_tag }}-replaced-${{ steps.previous.outputs.sha }}
          path: ${{ runner.temp }}/replaced
          if-no-files-found: error
          retention-days: 90
          overwrite: true

      - name: Move the tag and replace the release assets
        if: ${{ inputs.publish && inputs.replace_existing }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="RimworldStatistics-$RELEASE_TAG"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/$asset.zip" "$RUNNER_TEMP/$asset.sha256" --clobber
          gh release edit "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Rimworld Statistics $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --latest
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.prerelease' <<<"$release")" = false
          names=$(jq -r '[.assets[].name] | sort | join(",")' <<<"$release")
          test "$names" = "$asset.sha256,$asset.zip"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          # The published files must be byte for byte the ones verified above.
          check="$RUNNER_TEMP/published"
          mkdir -p "$check"
          gh release download "$RELEASE_TAG" --dir "$check" --pattern "$asset.*"
          cmp "$check/$asset.zip" "$RUNNER_TEMP/$asset.zip"
          cmp "$check/$asset.sha256" "$RUNNER_TEMP/$asset.sha256"
          echo "$RELEASE_TAG replaced: tag $(cat "$RUNNER_TEMP/replaced/previous-tag-sha.txt") -> $GITHUB_SHA, host ZIP and checksum re-uploaded."
