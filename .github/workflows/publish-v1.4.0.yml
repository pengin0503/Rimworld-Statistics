name: Publish Rimworld Statistics v1.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rws-v1.4.0
  cancel-in-progress: false

jobs:
  host-release:
    if: github.repository == 'pengin0503/Rimworld-Statistics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
      RELEASE_TAG: 'v1.4.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Reject existing version, tag, or release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing retag" >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path("About/About.xml")).getroot()
          assert root.findtext("modVersion") == "1.4.0"
          assert Path("docs/releases/v1.4.0.md").is_file()
          PY

      - name: Verify game-independent core tests
        run: dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo -p:UseNuGetRefs=true

      - name: Validate translations
        run: bash tools/check_keys.sh

      - name: Package and inspect exact host distribution
        shell: bash
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/RimworldStatistics-v1.4.0.zip"
          bash tools/package.sh "$zip"
          python3 tools/check_sdk_package.py "$zip"
          unzip -t "$zip"
          python3 - "$zip" <<'PY'
          import sys, zipfile, xml.etree.ElementTree as ET
          with zipfile.ZipFile(sys.argv[1]) as z:
              root = ET.fromstring(z.read("RimworldStatistics/About/About.xml"))
              assert root.findtext("modVersion") == "1.4.0"
              paths = z.namelist()
              assert all(p.startswith("RimworldStatistics/") for p in paths)
              assert not any(term in p.lower() for p in paths for term in (
                  "verifyharness", "smartapparel", "recruitment", "hospitality", "addon"
              ))
          PY
          (cd "$RUNNER_TEMP" && sha256sum RimworldStatistics-v1.4.0.zip > RimworldStatistics-v1.4.0.sha256)

      - name: Create immutable v1.4.0 tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/RimworldStatistics-v1.4.0.zip" \
            "$RUNNER_TEMP/RimworldStatistics-v1.4.0.sha256" \
            --target "$GITHUB_SHA" \
            --title "Rimworld Statistics v1.4.0" \
            --notes-file docs/releases/v1.4.0.md \
            --latest
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          test "$(jq -r '.tag_name' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release")" = false
          test "$(jq -r '.prerelease' <<<"$release")" = false
          names=$(jq -r '[.assets[].name] | sort | join(",")' <<<"$release")
          test "$names" = "RimworldStatistics-v1.4.0.sha256,RimworldStatistics-v1.4.0.zip"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$tag_sha" = "$GITHUB_SHA"
          echo "v1.4.0 published at $GITHUB_SHA with host ZIP and checksum."
