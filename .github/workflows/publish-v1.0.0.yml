name: Publish Rimworld Statistics v1.0.0

on:
  push:
    paths:
      - .github/workflows/publish-v1.0.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'pengin0503/Rimworld-Statistics'
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run core regression tests
        run: dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo -p:UseNuGetRefs=true
      - name: Build and package using public NuGet references
        shell: bash
        run: bash tools/package.sh "$RUNNER_TEMP/RimworldStatistics-v1.0.0.zip"
      - name: Verify distributable contains the mod DLLs, not game dependencies
        shell: bash
        run: |
          set -euo pipefail
          zipfile="$RUNNER_TEMP/RimworldStatistics-v1.0.0.zip"
          unzip -t "$zipfile"
          names="$(unzip -Z -1 "$zipfile")"
          grep -Fxq 'RimworldStatistics/About/About.xml' <<< "$names"
          grep -Fxq 'RimworldStatistics/1.7/Assemblies/RimworldStatistics.dll' <<< "$names"
          grep -Fxq 'RimworldStatistics/1.7/Assemblies/RimworldStatistics.Core.dll' <<< "$names"
          grep -Fxq 'RimworldStatistics/Languages/Japanese/Keyed/RimworldStatistics.xml' <<< "$names"
          grep -Fxq 'RimworldStatistics/Languages/English/Keyed/RimworldStatistics.xml' <<< "$names"
          if grep -Eq '/(Assembly-CSharp|UnityStubs|Waylith|0Harmony)\\.dll$' <<< "$names"; then
            echo 'ERROR: Game/Harmony dependency DLL included in distributable' >&2
            exit 1
          fi
          sha256sum "$zipfile"
      - name: Publish installable ZIP to existing v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.0 >/dev/null
          gh release upload v1.0.0 "$RUNNER_TEMP/RimworldStatistics-v1.0.0.zip" --clobber
