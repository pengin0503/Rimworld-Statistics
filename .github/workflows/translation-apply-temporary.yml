name: Translation block application (temporary)
on:
  push:
    branches:
      - translation/retranslate-remaining-20261114
    paths:
      - 'tools/translation/work/**'
      - 'tools/translation/progress.json'
permissions:
  contents: write
concurrency:
  group: translation-retranslate-remaining-20261114
  cancel-in-progress: false
jobs:
  apply-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply vetted translations through repository scripts
        shell: bash
        run: |
          set -euo pipefail
          for lang in English Japanese; do
            if [ -f "tools/translation/work/${lang}_modes.json" ]; then
              python3 tools/translation/apply_patch.py "${lang}" "tools/translation/work/${lang}_modes.json"
            fi
          done
          python3 - <<'PY' > /tmp/completed-translation-blocks.txt
          import json
          p = json.load(open('tools/translation/progress.json', encoding='utf-8'))
          langs = ['German','French','Spanish','SpanishLatin','Portuguese','PortugueseBrazilian','Russian','ChineseSimplified','ChineseTraditional','Korean']
          done = set.intersection(*(set(p['retranslatedBlocks'][lang]) for lang in langs))
          for b in p['blocks']:
              if b['id'] in done and b['id'] not in ('01','02'):
                  print(b['id'], b['start'], b['end'])
          PY
          while read -r nn start end; do
            bash tools/translation/apply_chunk.sh "$nn" "$start" "$end"
          done < /tmp/completed-translation-blocks.txt
          for patch in tools/translation/work/*_qa.json; do
            [ -f "$patch" ] || continue
            lang="${patch##*/}"
            lang="${lang%_qa.json}"
            python3 tools/translation/apply_patch.py "$lang" "$patch"
          done
          bash tools/check_keys.sh
          git add -u Languages
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply completed translation blocks via translation scripts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
