name: Publish Smart Apparel Statistics Addon v0.1.0 (experimental)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-sau-addon-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rws-sau-addon-v0.1.0
  cancel-in-progress: false

jobs:
  addon-release:
    if: github.repository == 'pengin0503/Rimworld-Statistics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
      RELEASE_TAG: 'sau-addon-v0.1.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release tag already exists" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: pengin0503/rimworld-Smart-Apparel-Upgrade
          ref: 5e910b82281fa6d5a4ebc3bcb5b88b1610b1dba8
          path: .devinputs/sau-1.0.1
          persist-credentials: false
      - name: Verify audited target source
        run: python3 tools/check_sau_contract.py .devinputs/sau-1.0.1
      - name: Core and addon deterministic regression tests
        run: dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo
      - name: Independent external API host and duplicate-event probe
        run: dotnet run --project tools/SauAddonProbe/SauAddonProbe.csproj -c Release --no-launch-profile
      - name: Verify missing SDK API does not break addon startup
        shell: bash
        run: |
          set -euo pipefail
          folder=tools/SauAddonProbe/bin/Release/net10.0
          test -f "$folder/RimworldStatistics.Api.dll"
          mv "$folder/RimworldStatistics.Api.dll" "$RUNNER_TEMP/removed-api.dll"
          dotnet "$folder/SauAddonProbe.dll" --no-api
      - name: Build strictly isolated addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          bash tools/package_sau_addon.sh "$RUNNER_TEMP/RimworldStatistics.SmartApparelAddon-v0.1.0.zip"
          python3 tools/check_sau_addon.py "$RUNNER_TEMP/RimworldStatistics.SmartApparelAddon-v0.1.0.zip"
          unzip -t "$RUNNER_TEMP/RimworldStatistics.SmartApparelAddon-v0.1.0.zip"
          (cd "$RUNNER_TEMP" && sha256sum RimworldStatistics.SmartApparelAddon-v0.1.0.zip > RimworldStatistics.SmartApparelAddon-v0.1.0.sha256)
      - name: Publish standalone experimental addon
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## RimWorld 1.7 — Smart Apparel Upgrade statistics addon (EXPERIMENTAL)

          **This is an optional addon, not the Rimworld-Statistics host.** Install the [Rimworld Statistics v1.2.0 host](https://github.com/pengin0503/Rimworld-Statistics/releases/tag/v1.2.0) separately, along with Smart Apparel Upgrade **1.0.1**. Place the extracted RimworldStatistics.SmartApparelAddon folder under Mods and load it after the host and target.

          ### Tracked metric
          - `mod.pengin0503.smartapparelupgrade.orders.issued`: the number of SAU **automatic Wear-job orders actually issued**, not the number of completed outfit upgrades.
          - The source method and post-success stamp logic were audited at Smart Apparel Upgrade commit `5e910b82281fa6d5a4ebc3bcb5b88b1610b1dba8`.
          - One order produces one stable technical event ID, which the host hashes and deduplicates. No pawn names or long event history are stored.
          - In Statistics MOD settings, enable experimental acquisition and select `mod.pengin0503.smartapparelupgrade.orders`, then **restart RimWorld**. No retroactive collection.

          ### Boundaries
          - Versions outside SAU 1.0.1 or with missing version metadata fail closed. Missing host, missing target, rejected SDK registration or failed Harmony patch must not fabricate a zero.
          - No game play acceptance was performed for this addon; source contract, synthetic SDK probes, Core tests and isolated ZIP checks passed in CI.
          - Rimworld Statistics API 1.1 and the extra metric remain experimental, not Verified.
          - The optional package includes **no copy of the host SDK DLL, target MOD DLL, Harmony or the game**. Do not install it without the intended host/target MODs.

          [Addon documentation](https://github.com/pengin0503/Rimworld-Statistics/blob/main/addons/SmartApparelUpgrade/README.md) · [Architecture](https://github.com/pengin0503/Rimworld-Statistics/blob/main/docs/sdk/addon-architecture.md)
          NOTES
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/RimworldStatistics.SmartApparelAddon-v0.1.0.zip" \
            "$RUNNER_TEMP/RimworldStatistics.SmartApparelAddon-v0.1.0.sha256" \
            --target "$GITHUB_SHA" \
            --title "Rimworld Statistics - Smart Apparel Upgrade Addon v0.1.0 (experimental)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
