name: Publish Rimworld Statistics v1.2.0-rc.4 SDK performance preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.0-rc.4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-rimworld-statistics-v1.2.0-rc.4
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.repository == 'pengin0503/Rimworld-Statistics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      UseNuGetRefs: 'true'
      RELEASE_TAG: 'v1.2.0-rc.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Refuse to overwrite an existing version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to overwrite." >&2
            exit 1
          fi
      - name: Run full no-game Core regression tests
        run: dotnet test Tests/RimworldStatistics.Core.Tests/RimworldStatistics.Core.Tests.csproj -c Release --nologo -p:UseNuGetRefs=true
      - name: Verify SDK event allocation optimization
        run: dotnet run -c Release --project tools/SdkEventBenchmark/SdkEventBenchmark.csproj --no-launch-profile
      - name: Validate translation keys
        run: bash tools/check_keys.sh
      - name: Independently compile and probe SDK consumer
        shell: bash
        run: |
          set -euo pipefail
          for minor in 0 1; do
            dotnet build examples/StatisticsSdkSample/StatisticsSdkSample.csproj -c Release "-p:RequiredApiMinor=$minor" --nologo
            dotnet run --project tools/SdkSampleProbe/SdkSampleProbe.csproj -c Release "-p:RequiredApiMinor=$minor" --no-launch-profile
          done
      - name: Build host and independent development sample ZIPs
        shell: bash
        run: |
          set -euo pipefail
          bash tools/package.sh "$RUNNER_TEMP/RimworldStatistics-v1.2.0-rc.4.zip"
          bash tools/package_sdk_sample.sh "$RUNNER_TEMP/StatisticsSdkSample-v1.2.0-rc.4.zip"
      - name: Verify release package ownership, archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/RimworldStatistics-v1.2.0-rc.4.zip"
          sample="$RUNNER_TEMP/StatisticsSdkSample-v1.2.0-rc.4.zip"
          python3 tools/check_sdk_package.py "$host" "$sample"
          unzip -t "$host"
          unzip -t "$sample"
          names="$(unzip -Z -1 "$host")"
          grep -Fxq 'RimworldStatistics/About/About.xml' <<< "$names"
          grep -Fxq 'RimworldStatistics/1.7/Assemblies/RimworldStatistics.dll' <<< "$names"
          grep -Fxq 'RimworldStatistics/1.7/Assemblies/RimworldStatistics.Core.dll' <<< "$names"
          grep -Fxq 'RimworldStatistics/1.7/Assemblies/RimworldStatistics.Api.dll' <<< "$names"
          grep -Fxq 'RimworldStatistics/Languages/Japanese/Keyed/RimworldStatistics.xml' <<< "$names"
          grep -Fxq 'RimworldStatistics/Languages/English/Keyed/RimworldStatistics.xml' <<< "$names"
          if grep -Eq 'VerifyHarness|/(Recruitment|Assembly-CSharp|UnityStubs|Waylith|0Harmony)\\.dll$' <<< "$names"; then
            echo 'ERROR: Optional game dependency or development verification harness leaked into release.' >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP" && sha256sum RimworldStatistics-v1.2.0-rc.4.zip StatisticsSdkSample-v1.2.0-rc.4.zip > RimworldStatistics-v1.2.0-rc.4.sha256)
      - name: Publish prerelease from tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          ## RimWorld 1.7 — P3 external MOD statistics SDK (experimental)

          このリリースには外部MOD統計SDK（P3）とイベント記録の軽量化を含めています。**実機検証とTPS・保存性能測定は未実施**です。現時点では正式なAPI互換性保証はありません。安定版ではなく、導入・検証用の**プレリリース**です。

          ### Changes since v1.2.0-rc.3
          - [PR #45](https://github.com/pengin0503/Rimworld-Statistics/pull/45) optimizes SDK event recording by precomputing accumulator keys and using stack-allocated buffers for UTF-8 conversion and SHA-256 hashing. Dedup hashes, persisted metric keys, event handling and public API remain unchanged.
          - Two no-game GitHub Actions microbenchmark runs showed allocation improvements of 352 -> 152 bytes per duplicate event (~57%) and 634.8 -> 331.2 bytes per unique event (~48%). CPU timings varied between runs; these are **not** RimWorld TPS measurements.
          - Full CI on the PR and the merged main commit: 565 Core tests (563 passed, 2 real-save skips, 0 failed); SDK binary compatibility, consumer matrix, packaging and static checks successful.
          - Added a repeatable event allocation benchmark to CI with an allocation-regression threshold.

          ### Previous preview features (v1.2.0-rc.3)
          - External `RimworldStatistics.Api.dll` (API v1.1, experimental): optional host discovery and version negotiation; consumers without the SDK installed fail closed rather than preventing game startup.
          - Event Count/Sum/Mean and save-time snapshot metrics reuse the audited statistics checkpoints, profiles, experimental acquisition gates and history display.
          - SHA-256 event ID deduplication, bounded memory, coverage-gap markers and source failure isolation; historical data survives MOD removal, reload and branch handling.
          - Fixed cumulative counts/deduplication when SDK metric name casing changes, and reporting unsampled mean values incorrectly after a coverage gap.
          - Independent development-only sample MOD supports explicit game-settings test actions, persistent event IDs and one-shot exception injection.
          - CI includes SDK 1.0 synthetic binary ABI probe, missing-host check, version-minor matrix and DLL ownership/packaging audit.

          **IMPORTANT:** RimWorld 1.7 in-game operation, save/restore with real MOD combinations, source-specific integration, and performance targets (TPS median regression <=2%; save overhead <=50ms or <=5%) were **not validated**. The 1.0 ABI test uses a synthetic frozen fixture, not a previously shipped public v1.0 binary. See [P3 game acceptance protocol](https://github.com/pengin0503/Rimworld-Statistics/blob/main/docs/sdk/p3-game-acceptance.md).

          ### Files
          - `RimworldStatistics-v1.2.0-rc.4.zip`: installable host MOD (requires Harmony).
          - `StatisticsSdkSample-v1.2.0-rc.4.zip`: **development-only**, optional sample MOD for testing; install only for SDK tests.
          - `RimworldStatistics-v1.2.0-rc.4.sha256`: SHA-256 digest of both packages.

          **Install:** extract the ZIP and place the `RimworldStatistics` folder under `Mods`. Do not install a second `RimworldStatistics.Api.dll`; the sample does not bundle it. Back up save/profile data before manual testing.

          [Optimization PR #45](https://github.com/pengin0503/Rimworld-Statistics/pull/45) · [Implementation PR #44](https://github.com/pengin0503/Rimworld-Statistics/pull/44) · [Performance analysis](https://github.com/pengin0503/Rimworld-Statistics/blob/main/docs/performance/2026-11-09-sdk-event-fast-path.md) · [SDK documentation](https://github.com/pengin0503/Rimworld-Statistics/blob/main/docs/sdk/external-provider-api-v1.md)
          NOTES
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/RimworldStatistics-v1.2.0-rc.4.zip" \
            "$RUNNER_TEMP/StatisticsSdkSample-v1.2.0-rc.4.zip" \
            "$RUNNER_TEMP/RimworldStatistics-v1.2.0-rc.4.sha256" \
            --target "$GITHUB_SHA" \
            --title "Rimworld Statistics v1.2.0-rc.4 (SDK optimization preview; unverified)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --prerelease
